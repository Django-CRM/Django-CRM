[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-crm"
version = "1.3.0"
description = "Open-source multi-tenant CRM platform built on Django REST Framework with row-level security."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "MicroPyramid", email = "hello@micropyramid.com" },
]
keywords = [
    "django",
    "crm",
    "drf",
    "django-rest-framework",
    "multi-tenant",
    "saas",
    "sales",
    "leads",
    "contacts",
    "opportunity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "django>=6.0.7",
    "celery>=5.6.3",
    "python-dotenv>=1.2.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "django-ses>=4.7.2",
    # psycopg 3, not psycopg2. The `pool` extra is required: Django refuses
    # pool options under psycopg2 (ImproperlyConfigured, "Database pooling
    # requires psycopg >= 3"), and DATABASES["default"]["OPTIONS"]["pool"] in
    # crm/settings.py depends on it. No application code imports the driver
    # directly, so the swap is confined to this line.
    "psycopg[binary,pool]>=3.2.10",
    "whitenoise>=6.12.0",
    "sentry-sdk>=2.66.1",
    "django-storages>=1.14.6",
    "django-crum>=0.7.9",
    "disposable-email-domains>=0.0.231",
    "redis>=8.0.1",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "faker>=40.36.0",
    "python-dateutil>=2.9.0.post0",
    "google-auth>=2.56.2",
    # X.509 handling for inbound SNS webhook signature verification
    # (cases/inbound/sns.py). Needs >=42 for the not_valid_*_utc accessors.
    "cryptography>=49.0.0",
    # PDF generation (also needs system libs: cairo, pango, gdk-pixbuf, libffi, shared-mime-info)
    "weasyprint>=69.0",
    "cairocffi>=1.7.1",
    # Production WSGI server
    "gunicorn>=26.0.0",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/django-crm/Django-CRM"
Repository = "https://github.com/django-crm/Django-CRM"
Documentation = "https://github.com/django-crm/Django-CRM#readme"
Issues = "https://github.com/django-crm/Django-CRM/issues"
Changelog = "https://github.com/django-crm/Django-CRM/releases"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
# Must stay in sync with the first-party entries of INSTALLED_APPS in
# crm/settings.py, plus the crm project package itself. An app installed but
# not packaged here imports fine from a source checkout and raises
# ModuleNotFoundError on a pip install, which is how business_hours and macros
# went missing. common/tests/test_packaging.py fails if the two drift apart.
packages = [
    "accounts",
    "business_hours",
    "cases",
    "common",
    "contacts",
    "crm",
    "invoices",
    "leads",
    "macros",
    "opportunity",
    "orders",
    "tasks",
]

[tool.hatch.build.targets.sdist]
include = [
    "accounts/",
    "business_hours/",
    "cases/",
    "common/",
    "contacts/",
    "crm/",
    "invoices/",
    "leads/",
    "macros/",
    "opportunity/",
    "orders/",
    "tasks/",
    "static/",
    "manage.py",
    ".env.example",
    "pytest.ini",
    "ruff.toml",
    "README.md",
]
