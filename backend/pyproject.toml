[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-crm"
version = "1.3.1"
# The one-line summary PyPI shows under the project title and in search results,
# so it carries the terms people actually search for ("open source CRM",
# "self-hosted CRM", "Django CRM") and names the modules rather than the
# architecture. Published release metadata is immutable, so a change here only
# reaches PyPI on the next version bump.
description = "Open-source self-hosted CRM with a Django REST API: leads, deals, contacts, invoices and support tickets, multi-tenant by PostgreSQL row-level security."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "MicroPyramid", email = "hello@micropyramid.com" },
]
keywords = [
    "django",
    "crm",
    "drf",
    "django-rest-framework",
    "multi-tenant",
    "saas",
    "sales",
    "leads",
    "contacts",
    "opportunity",
    # Added for discovery: these are the phrases people search rather than the
    # words the codebase happens to use. "self-hosted" and "open-source-crm"
    # are how someone shopping for an alternative describes what they want.
    "self-hosted",
    "open-source-crm",
    "sales-pipeline",
    "invoicing",
    "helpdesk",
    "support-tickets",
    "rest-api",
    "postgresql",
    "row-level-security",
    "salesforce-alternative",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "django>=6.0.7",
    "celery>=5.6.3",
    "python-dotenv>=1.2.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "django-ses>=4.7.2",
    # psycopg 3, not psycopg2. The `pool` extra is required: Django refuses
    # pool options under psycopg2 (ImproperlyConfigured, "Database pooling
    # requires psycopg >= 3"), and DATABASES["default"]["OPTIONS"]["pool"] in
    # crm/settings.py depends on it. No application code imports the driver
    # directly, so the swap is confined to this line.
    "psycopg[binary,pool]>=3.2.10",
    "whitenoise>=6.12.0",
    "sentry-sdk>=2.66.1",
    "django-storages>=1.14.6",
    "django-crum>=0.7.9",
    "disposable-email-domains>=0.0.231",
    "redis>=8.0.1",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "faker>=40.36.0",
    "python-dateutil>=2.9.0.post0",
    "google-auth>=2.56.2",
    # X.509 handling for inbound SNS webhook signature verification
    # (cases/inbound/sns.py). Needs >=42 for the not_valid_*_utc accessors.
    "cryptography>=49.0.0",
    # PDF generation (also needs system libs: cairo, pango, gdk-pixbuf, libffi, shared-mime-info)
    "weasyprint>=69.0",
    "cairocffi>=1.7.1",
    # Production WSGI server
    "gunicorn>=26.0.0",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
# Owner spelled `Django-CRM`, matching GitHub's own casing. The lowercase form
# these used to carry resolves fine, because GitHub URLs are case-insensitive,
# which is exactly what makes the habit dangerous: the same lowercase spelling
# in the PyPI trusted publisher silently matched nothing and cost three failed
# releases of 1.3.0. Keep every reference to the repo in GitHub's casing.
Homepage = "https://github.com/Django-CRM/Django-CRM"
Repository = "https://github.com/Django-CRM/Django-CRM"
Documentation = "https://github.com/Django-CRM/Django-CRM#readme"
Issues = "https://github.com/Django-CRM/Django-CRM/issues"
Changelog = "https://github.com/Django-CRM/Django-CRM/releases"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
# Must stay in sync with the first-party entries of INSTALLED_APPS in
# crm/settings.py, plus the crm project package itself. An app installed but
# not packaged here imports fine from a source checkout and raises
# ModuleNotFoundError on a pip install, which is how business_hours and macros
# went missing. common/tests/test_packaging.py fails if the two drift apart.
packages = [
    "accounts",
    "business_hours",
    "cases",
    "common",
    "contacts",
    "crm",
    "invoices",
    "leads",
    "macros",
    "opportunity",
    "orders",
    "tasks",
]

[tool.hatch.build.targets.sdist]
include = [
    "accounts/",
    "business_hours/",
    "cases/",
    "common/",
    "contacts/",
    "crm/",
    "invoices/",
    "leads/",
    "macros/",
    "opportunity/",
    "orders/",
    "tasks/",
    "static/",
    "manage.py",
    ".env.example",
    "pytest.ini",
    "ruff.toml",
    "README.md",
]
