# CodeQL static analysis. Results land in the Security tab under Code scanning.
#
# This file was the stock 2020 starter template until 2026-08-12 and had been
# failing on every run for years: `github/codeql-action@v1` was retired by
# GitHub in January 2023, and the job carried no `permissions:` block, so the
# SARIF upload died on "Resource not accessible by integration". A scanner that
# fails every run is worse than no scanner, because the Security tab keeps
# showing the last results it managed to upload and nothing says they are stale.
name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]
  schedule:
    - cron: '41 18 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    # Declaring this block at all drops every permission not listed to `none`,
    # so these two are the whole set the job gets. `security-events: write` is
    # the one that was missing and the only reason the job exists: it is what
    # lets `analyze` upload the SARIF. `contents: read` is for the checkout.
    # The upstream template also lists `packages: read` and `actions: read`,
    # both needed only by private repositories. This one is public.
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Python only. The SvelteKit frontend is not scanned; adding
        # `javascript-typescript` here is a real coverage gain and a real new
        # alert backlog, so it is a decision rather than a fix.
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # No Autobuild step. The template shipped one, but it only does anything
      # for compiled languages (C/C++, C#, Java, Go). Python needs no build, so
      # the step was config that could never do anything.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          # Keeps each matrix language's results a separate analysis. Without
          # it a second language added above would overwrite this one's alerts
          # rather than sit alongside them.
          category: "/language:${{ matrix.language }}"
